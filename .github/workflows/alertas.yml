name: Notificacao Discord

on: [push]

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar Alerta
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          content: "🚀 **Fernando Alex de Souza** realizou um Push! Monitoramento DevOps ativo."
